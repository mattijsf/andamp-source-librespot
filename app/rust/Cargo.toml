[package]
name = "andamp-librespot"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "andamp_librespot"
crate-type = ["cdylib"]

[dependencies]
jni = "0.21"
log = "0.4"
android_logger = "0.14"
once_cell = "1"
# decodes the base64 file ids and gids that metadata answers carry
base64 = "0.22"
# the same version librespot uses, so the Context it hands back prints
protobuf = "3.7"
protobuf-json-mapping = "3.7"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }

# No audio backend feature: the samples go to Kotlin through this crate's own
# sink. That also leaves out cpal, oboe and the C++ runtime they need.
librespot-core = { path = "../third_party/librespot/core", default-features = false, features = [
    "rustls-tls-webpki-roots",
] }
librespot-playback = { path = "../third_party/librespot/playback", default-features = false }
librespot-metadata = { path = "../third_party/librespot/metadata", default-features = false, features = [
    "rustls-tls-webpki-roots",
] }
librespot-oauth = { path = "../third_party/librespot/oauth", default-features = false, features = [
    "rustls-tls-webpki-roots",
] }
librespot-protocol = { path = "../third_party/librespot/protocol" }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"
